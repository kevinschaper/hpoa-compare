# Pinned inputs for the dismech-vs-HPOA comparison.
# Regenerate checksums after `just fetch`; commit this file so the comparison
# is reproducible. Large input files themselves live under data/inputs/ and are
# gitignored.
inputs:
  hpoa_jax:
    description: HPO project's phenotype.hpoa (the gold-standard reference)
    url: https://github.com/obophenotype/human-phenotype-ontology/releases/latest/download/phenotype.hpoa
    filename: phenotype.hpoa
    version: "2026-02-16"
    sha256: 5d7aedee5f6218e9952fceba5f883df2cc4a0c1938e55d8d2616c15c517964fb

  mondo_sssom:
    description: MONDO SSSOM mappings (MONDO <-> OMIM/Orphanet/... for the disease axis)
    url: https://purl.obolibrary.org/obo/mondo/mappings/mondo.sssom.tsv
    filename: mondo.sssom.tsv
    sha256: 9574e2fc0eaa6a3669f663257516592abdbedac745d1bda6e92aba74ac3123c8

  dismech_hpoa:
    description: >-
      dismech's HPOA-extended export (phenotype.dismech.hpoa). Generated by
      `dismech.export.hpoa_export` and copied in. Source commit recorded below.
    filename: phenotype.dismech.hpoa
    source_repo: monarch-initiative/dismech
    source_branch: claude/hpoa-export
    sha256: a7276222203cf9e235eed529c6eeb371dbbd8eae57a5c08380e34beeb3280f16

  hpo_db:
    description: >-
      HPO semantic-SQL build (semsql) for transitive is-a closure (entailed_edge)
      and structure-based information content. Fetched to data/inputs/hp.db.
    url: https://s3.amazonaws.com/bbop-sqlite/hp.db.gz
    filename: hp.db
