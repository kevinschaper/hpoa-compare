# Pinned inputs for the dismech-vs-HPOA comparison.
# Regenerate checksums after `just fetch`; commit this file so the comparison
# is reproducible. Large input files themselves live under data/inputs/ and are
# gitignored.
inputs:
  hpoa_jax:
    description: HPO project's phenotype.hpoa (the gold-standard reference)
    url: https://github.com/obophenotype/human-phenotype-ontology/releases/latest/download/phenotype.hpoa
    filename: phenotype.hpoa
    version: "2026-02-16"
    sha256: 5d7aedee5f6218e9952fceba5f883df2cc4a0c1938e55d8d2616c15c517964fb

  mondo_sssom:
    description: MONDO SSSOM mappings (MONDO <-> OMIM/Orphanet/... for the disease axis)
    url: https://purl.obolibrary.org/obo/mondo/mappings/mondo.sssom.tsv
    filename: mondo.sssom.tsv
    mondo_release: "v2026-06-02"
    sha256: 9574e2fc0eaa6a3669f663257516592abdbedac745d1bda6e92aba74ac3123c8

  mondo_graph:
    description: >-
      MONDO is-a graph for disease-axis closure, taken from the release's KGX
      nodes/edges rather than semsql. The semsql mondo.db lags the OBO release
      (bbop-sqlite was still on the 2026-05-05 build), so the KGX artifacts are
      the freshest MONDO graph that is version-matched to mondo.sssom above.
      ~43.9k MONDO->MONDO biolink:subclass_of edges over ~33.8k nodes.
    mondo_release: "v2026-06-02"
    edges:
      url: https://github.com/monarch-initiative/mondo/releases/latest/download/mondo_edges.tsv
      filename: mondo_edges.tsv
      sha256: 01e7d924d93fa1cf25027a05c6dbf78e764ac5ee8b1cbe2446b5d187aca4cee5
    nodes:
      url: https://github.com/monarch-initiative/mondo/releases/latest/download/mondo_nodes.tsv
      filename: mondo_nodes.tsv
      sha256: f7614a7de9748f2d1672bc5885362a281b7edfebb3fc0ccb9975431813cb2c69

  dismech_hpoa:
    description: >-
      dismech's HPOA-extended export (phenotype.dismech.hpoa). Generated by
      `dismech.export.hpoa_export` and copied in. Source commit recorded below.
    filename: phenotype.dismech.hpoa
    source_repo: monarch-initiative/dismech
    source_branch: claude/hpoa-export
    sha256: a7276222203cf9e235eed529c6eeb371dbbd8eae57a5c08380e34beeb3280f16

  hpo_db:
    description: >-
      HPO semantic-SQL build (semsql) for the PHENOTYPE axis: transitive is-a
      closure (entailed_edge) and structure-based IC. Fetched to data/inputs/hp.db.
      Currency should track the phenotype.hpoa release; HP terms in annotations
      are stable, so modest lag is tolerable -- unlike the MONDO disease graph,
      which we pin to the release KGX above to stay version-matched to the SSSOM.
    url: https://s3.amazonaws.com/bbop-sqlite/hp.db.gz
    filename: hp.db
