[project]
name = "hpoa-compare"
version = "0.1.0"
description = "Hierarchy-aware comparison of dismech's HPOA export against HPO's phenotype.hpoa"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
hpoa-compare = "hpoa_compare.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/hpoa_compare"]

[tool.ruff]
line-length = 100
src = ["pipeline"]
